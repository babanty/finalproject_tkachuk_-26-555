[project]
name = "finalproject-tkachuk-m26-555"
version = "0.1.0"
description = "Console simulator for a virtual multi-currency wallet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=4.2.0",
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.cli.interface:parser_main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
